name: CI

on:
  pull_request:
  push:
    branches: [pre-producao, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Placeholders — o build nunca chama o Supabase de verdade (app/layout.tsx
      # força renderização dinâmica), só precisa de strings não-vazias pra
      # passar pela asserção não-nula em lib/supabaseClient.ts.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
