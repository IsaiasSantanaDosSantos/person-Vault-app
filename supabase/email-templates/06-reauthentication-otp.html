<!doctype html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="dark light" />
  <meta name="supported-color-scheme" content="dark light" />
  <title>Seu código de verificação — Cofre</title>
  <style>
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .px { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#0E1113;">
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; opacity:0;">
    Seu código de verificação do Cofre.
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0E1113" style="background-color:#0E1113;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <img src="https://pessoal-vault-app-flax.vercel.app/icons/icon-192.png" width="48" height="48" alt="Cofre" style="display:block; border:0; border-radius:10px;" />
              <div style="font-family:Arial, Helvetica, sans-serif; font-size:15px; font-weight:bold; color:#E7E9EA; margin-top:10px;">Cofre</div>
            </td>
          </tr>
          <tr>
            <td class="px" bgcolor="#161A1D" style="background-color:#161A1D; border:1px solid #262B2F; border-radius:12px; padding:40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="font-family:Arial, Helvetica, sans-serif; font-size:20px; font-weight:bold; color:#E7E9EA; padding-bottom:16px;">
                    Seu código de verificação
                  </td>
                </tr>
                <tr>
                  <td align="center" style="font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:24px; color:#E7E9EA; padding-bottom:28px;">
                    Use o código abaixo pra confirmar que é você. Ele expira em pouco tempo.
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-bottom:8px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;">
                      <tr>
                        <td bgcolor="#0E1113" style="background-color:#0E1113; border:1px solid #262B2F; border-radius:8px; padding:18px 36px;">
                          <span style="font-family:'Courier New', Courier, monospace; font-size:30px; font-weight:bold; letter-spacing:8px; color:#F5DF4E;">{{ .Token }}</span>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:28px; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:20px; color:#8A9096;">
              O Cofre nunca vai te pedir sua senha mestra ou a senha da conta por e-mail.<br />
              <a href="https://pessoal-vault-app-flax.vercel.app" style="color:#8A9096; text-decoration:underline;">pessoal-vault-app-flax.vercel.app</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
